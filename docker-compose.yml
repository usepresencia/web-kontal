services:
    web-kontal:
        build:
            context: .
            target: dev
        ports:
            - '3002:3002'
        env_file:
            - .env.local
        environment:
            # Dentro do container, a api-kontal fica no host
            KONTAL_API_URL: http://host.docker.internal:3000/api/v1
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - .:/app
            - /app/node_modules
            - /app/.next
